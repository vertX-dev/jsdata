[package]
name = "jsdata"
version = "0.1.0"
edition = "2021"
authors = ["vertX"]
description = "Extract JS declarations from source files into a generated ES module"
license = "MIT"
readme = "README.md"
repository = "https://github.com/vertX-dev/jsdata"
homepage = "https://github.com/vertX-dev/jsdata"
keywords = ["javascript", "codegen", "extract", "documentation", "versioning"]
categories = ["command-line-utilities", "development-tools::build-utils"]
rust-version = "1.85"
exclude = ["extension/", ".github/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
notify = "8"
# CommonMark parser (the one rustdoc uses); default-features off drops the CLI-only getopts dep
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# reuse Vertion's version-marker filter (parser/filter/config) — no second marker language
vertion = "1.0"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3"
