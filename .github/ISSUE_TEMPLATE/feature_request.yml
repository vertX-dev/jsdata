name: Feature request
description: Suggest something jsdata should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        Describe the situation rather than the feature. Knowing the underlying
        problem often turns up a simpler answer than the one you had in mind —
        and sometimes one that already exists.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like jsdata to do?
      description: If you have a config directive or flag in mind, sketch it here.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What did you try instead?
      description: |
        Existing options that got close, and where they fell short. Worth
        skimming the [README](https://github.com/vertX-dev/jsdata/blob/main/README.md)
        first — `let` expressions, `--- <spec>` pins, `${VAR:-fallback}` paths
        and merge mode between them cover a lot of ground.

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Config grammar
        - Declaration extraction
        - Version / tag filtering
        - Merge mode (--pull-all)
        - CLI command or flag
        - Generated output
        - VSCode extension
        - Other
    validations:
      required: true
