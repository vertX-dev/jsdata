blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/vertX-dev/jsdata/security/advisories/new
    about: >-
      Report privately, never as a public issue. Note that a config reading any
      path it names, and `md ... <-- html` not sanitizing, are both documented
      intended behaviour.
  - name: Question or idea
    url: https://github.com/vertX-dev/jsdata/discussions
    about: For anything that isn't yet a bug report or a concrete proposal.
